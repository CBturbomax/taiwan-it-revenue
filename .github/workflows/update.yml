name: update dashboard

# 대시보드를 GitHub 서버에서 자동 갱신한다.
# 이게 없으면 누군가 자기 PC에서 run.bat을 눌러야만 갱신되고, 안 누르는 동안
# 팀원들은 어제 숫자를 보게 된다.
#
# 대만 공시는 익월 10일 마감이고 대만 업무시간(UTC+8)에 들어온다.
# UTC 02/06/10/14시 = 대만 10/14/18/22시.
# 대만 공시 마감은 익월 10일이라 1~10일에 신고가 몰린다. 그 기간엔 촘촘히,
# 나머지 기간엔 드물게 돈다. cron은 UTC이고 대만은 UTC+8.
#
#   1~10일   UTC 00~12시 매시간 = 대만 08~20시 매시간  (13회/일)
#   11일~    UTC 02/06/10/14시  = 대만 10/14/18/22시   (4회/일)
#
# 날짜 필드를 갈라놔야 1~10일에 두 스케줄이 겹치지 않는다.
on:
  schedule:
    - cron: "0 0-12 1-10 * *"
    - cron: "0 2,6,10,14 11-31 * *"
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write           # gh-pages 브랜치에 push
  actions: write            # 오래된 캐시 정리

concurrency:
  group: update-dashboard
  cancel-in-progress: false # 겹치면 앞 실행을 끝까지 두고 뒤를 대기시킨다

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # data.db는 저장소에 없다 (17.6MB, 매일 변경). 실행 사이에 캐시로 나른다.
      # 캐시가 없으면 아래 단계가 원본에서 통째로 다시 만든다 -- 캐시가 만료돼도
      # 스스로 복구된다.
      - name: Restore data.db
        id: dbcache
        uses: actions/cache/restore@v4
        with:
          path: data.db
          key: twrev-db-${{ github.run_id }}
          restore-keys: |
            twrev-db-

      - name: Check reachability
        run: |
          python - <<'PY'
          import ssl, sys, urllib.request
          sys.path.insert(0, ".")
          from fetch import make_ssl_context, UA
          ctx = make_ssl_context()
          for url in ("https://openapi.twse.com.tw/v1/opendata/t187ap05_L",
                      "https://mopsov.twse.com.tw/nas/t21/sii/t21sc03_115_6_0.html",
                      "https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap05_O"):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=60, context=ctx) as r:
                  print(f"OK {len(r.read()):>9}B  {url}")
          PY

      # A cache hit is not proof the database is usable. The very first run
      # failed *after* --master had written the company table, and the save step
      # (then `if: always()`) cached that 59KB stub. The next run saw a cache
      # hit, skipped the backfill, fetched only the last 3 months and published
      # a dashboard with 3 months of history instead of 48.
      # So: inspect what came back, and rebuild whenever it is not deep enough.
      - name: Validate restored database
        id: dbcheck
        run: |
          months=0
          if [ -f data.db ]; then
            months=$(python - <<'PY'
          import sqlite3
          try:
              c = sqlite3.connect("data.db")
              print(c.execute("SELECT COUNT(DISTINCT ym) FROM revenue").fetchone()[0])
          except Exception:
              print(0)
          PY
          )
          fi
          echo "restored data.db holds $months month(s)"
          # charts need 36 and YoY needs 12 more; anything shallower is broken
          if [ "$months" -ge 40 ]; then
            echo "need_backfill=0" >> "$GITHUB_OUTPUT"
          else
            echo "need_backfill=1" >> "$GITHUB_OUTPUT"
            echo "::warning::data.db has only $months months -- rebuilding from source"
          fi

      - name: Backfill
        if: steps.dbcheck.outputs.need_backfill == '1'
        run: |
          python fetch.py --master
          python fetch.py --backfill

      - name: Fetch
        run: |
          python fetch.py --master
          python fetch.py

      - name: Korean readings
        # exits 1 on unmapped hanja: a warning, not a failure
        run: python gen_names_auto.py || true

      - name: Build dashboard
        run: |
          python build.py --modal-all
          ls -lh dashboard.html

      # 마지막 방어선: 배포하기 전에 결과물이 말이 되는지 확인한다.
      # 한 번 잘못 올리면 팀원들은 그게 틀렸다는 걸 알 방법이 없다.
      - name: Sanity-check before publishing
        run: |
          python - <<'PY'
          import os, re, sqlite3, sys
          fail = []
          size = os.path.getsize("dashboard.html")
          if size < 1_500_000:
              fail.append(f"dashboard.html이 {size:,} bytes로 너무 작음")
          html = open("dashboard.html", encoding="utf-8").read()
          n_charts = html.count('class="cbox"')
          if n_charts < 100:
              fail.append(f"차트가 {n_charts}개뿐 (정상 113)")
          c = sqlite3.connect("data.db")
          months = c.execute("SELECT COUNT(DISTINCT ym) FROM revenue").fetchone()[0]
          if months < 40:
              fail.append(f"data.db에 {months}개월치뿐")
          rows = c.execute("SELECT COUNT(*) FROM revenue").fetchone()[0]
          print(f"dashboard {size:,} bytes, 차트 {n_charts}개, "
                f"data.db {months}개월 {rows:,}행")
          if fail:
              print("::error::배포 중단 -- " + " / ".join(fail))
              sys.exit(1)
          print("sanity OK")
          PY

      - name: Check for leftover hanja
        run: python audit_cjk.py || true

      # 새 키로 저장하고 restore-keys 접두사로 최신 것을 되찾는다.
      # 캐시 항목은 불변이라 같은 키에 덮어쓸 수 없다.
      #
      # `if: always()` 를 쓰면 안 된다. 실패한 실행의 반쪽짜리 DB가 캐시에 남아
      # 다음 실행을 오염시킨다 -- 실제로 그렇게 3개월치 대시보드가 배포됐다.
      # 기본값(success)이라 앞 단계가 모두 성공했을 때만 저장한다.
      - name: Save data.db
        uses: actions/cache/save@v4
        with:
          path: data.db
          key: twrev-db-${{ github.run_id }}

      # gh-pages에는 항상 커밋 1개만 남긴다. 2.5MB짜리 파일을 매일 쌓으면
      # 1년에 900MB가 영구히 남는다.
      - name: Publish to gh-pages
        run: |
          set -e
          STAGE=$(mktemp -d)
          cp dashboard.html "$STAGE/index.html"
          touch "$STAGE/.nojekyll"
          cd "$STAGE"
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "dashboard $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
          echo "published"

      # 실행마다 새 캐시 키가 생긴다(불변이라 덮어쓸 수 없음). 공시 기간엔
      # 하루 13개씩 쌓여 저장소 캐시 한도(10GB)를 향해 달린다. 최근 것만 남긴다.
      - name: Prune old caches
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keep=8
          ids=$(gh cache list --repo "$GITHUB_REPOSITORY" --limit 100 \
                  --json id,createdAt \
                  --jq "sort_by(.createdAt) | reverse | .[$keep:] | .[].id")
          n=0
          for id in $ids; do
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && n=$((n+1))
          done
          echo "오래된 캐시 $n개 삭제 (최근 $keep개 유지)"

      - name: Summary
        if: always()
        run: |
          {
            echo "### 대시보드 갱신"
            echo ""
            echo "- https://cbturbomax.github.io/taiwan-it-revenue/"
            if [ -f dashboard.html ]; then
              echo "- dashboard.html: $(du -h dashboard.html | cut -f1)"
            fi
            if [ -f data.db ]; then
              echo "- data.db: $(du -h data.db | cut -f1)"
            fi
            echo "- cache: ${{ steps.dbcache.outputs.cache-matched-key || '(없음 -> 전체 백필함)' }}"
          } >> "$GITHUB_STEP_SUMMARY"
